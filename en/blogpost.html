        <meta charset="utf-8">

        <title>Towards Functional Families</title>
        <meta property="og:title" content="Newsletter Article | Towards Functional Families" />
        <meta property="og:description" content="Read this newsletter article. We are a parenting-oriented organization with special emphasis on mothers as their role in parenting is crucial in our community. Led by Dr. Marlene Bastawros" />
        <meta property="og:image" content="https://www.functionalfamiliestherapy.com/images/tff-logo.png" />
        <meta property="og:type" content="website" />
        <link rel="icon" type="image/x-icon" href="/images/tff-logo.png">
        <link rel="alternate" hreflang="en" href="https://www.functionalfamiliestherapy.com/en/blogpost.html" />
        <link rel="alternate" hreflang="ar" href="https://www.functionalfamiliestherapy.com/ar/blogpost.html" />
        <link rel="alternate" hreflang="x-default" href="https://www.functionalfamiliestherapy.com/en/blogpost.html" />
        <!-- <link rel="canonical" href="https://www.functionalfamiliestherapy.com/en/blogpost.html" /> -->
        <script>

            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (id) {
            // 1. Sanitize the ID to prevent XSS injection in the DOM
            const cleanId = encodeURIComponent(id);
            const canonicalUrl = `https://www.functionalfamiliestherapy.com/en/blogpost.html?id=${cleanId}`;

            // 2. Set Canonical Tag (updates existing or creates new)
            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.rel = 'canonical';
                document.head.appendChild(canonicalLink);
            }
            canonicalLink.href = canonicalUrl;

            // 3. Set Open Graph URL for Social Media Sharing (Facebook, LinkedIn, etc.)
            let ogUrl = document.querySelector('meta[property="og:url"]');
            if (!ogUrl) {
                ogUrl = document.createElement('meta');
                ogUrl.setAttribute('property', 'og:url');
                document.head.appendChild(ogUrl);
            }
            ogUrl.content = canonicalUrl;
            } else {
            // 4. Fallback: If no ID is present, direct crawlers back to the main blog page or set noindex
            let robotsMeta = document.querySelector('meta[name="robots"]');
            if (!robotsMeta) {
                robotsMeta = document.createElement('meta');
                robotsMeta.name = 'robots';
                document.head.appendChild(robotsMeta);
            }
            robotsMeta.content = 'noindex, follow';
            }

        </script>


        <!-- CSS FILES -->        
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/tff-stylesheet.css" rel="stylesheet">

</head>
    
<body>
<div id="en-navbar"></div>

            <section class="section-padding">
                <div class="container-fluid px-5">
                    <div class="row">

                        <h1 id="title"></h1>

                        <div class="col-12 blog-post">
                            <i class="bi bi-clock ms-2 me-1"></i><i id="date"></i>
                            <div id="description"></div>
                            
                        </div>
                        <script src="https://unpkg.com/marked@4.3.0/marked.min.js"></script>
                            <script>
                                const params = new URLSearchParams(window.location.search)
                                const postId = params.get("id");

                                fetch('/_data/newsletter-en.json').then(res=>res.json().then(data=>{
                                    const post = data.issues.find(p => p.id === postId);
                                    const dateObj = new Date(post.date);
                                    const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };

                                    document.getElementById("title").textContent = post.title;
                                    document.getElementById("date").innerHTML =  dateObj.toLocaleString('en-GB', options).replace(',', '');
                                    document.getElementById("description").innerHTML = marked.parse(post.body);
                                }));

                            </script>

                        </div>
                    </div>
                </div>
            </section>

            
        </main>

        <div id="en-footer"></div>
