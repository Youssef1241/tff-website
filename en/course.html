<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <meta name="description" content="View course details and enroll. We are a parenting-oriented organization with special emphasis on mothers as their role in parenting is crucial in our community. Led by Dr. Marlene Bastawros">
        <meta name="author" content="">

        <title>Towards Functional Families</title>
        <meta property="og:title" content="Course Details | Towards Functional Families" />
        <meta property="og:description" content="View course details and enroll. We are a parenting-oriented organization with special emphasis on mothers as their role in parenting is crucial in our community. Led by Dr. Marlene Bastawros" />
        <!-- <meta property="og:url" content="https://www.functionalfamiliestherapy.com/en/course.html" /> -->
        <meta property="og:image" content="https://www.functionalfamiliestherapy.com/images/tff-logo.png" />
        <meta property="og:type" content="website" />
        <link rel="icon" type="image/x-icon" href="/images/tff-logo.png">
        <link rel="alternate" hreflang="en" href="https://www.functionalfamiliestherapy.com/en/course.html" />
        <link rel="alternate" hreflang="ar" href="https://www.functionalfamiliestherapy.com/ar/course.html" />
        <link rel="alternate" hreflang="x-default" href="https://www.functionalfamiliestherapy.com/en/course.html" />
        <!-- <link rel="canonical" href="https://www.functionalfamiliestherapy.com/en/course.html" /> -->

        <script>

            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (id) {
            // 1. Sanitize the ID to prevent XSS injection in the DOM
            const cleanId = encodeURIComponent(id);
            const canonicalUrl = `https://www.functionalfamiliestherapy.com/en/course.html?id=${cleanId}`;

            // 2. Set Canonical Tag (updates existing or creates new)
            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.rel = 'canonical';
                document.head.appendChild(canonicalLink);
            }
            canonicalLink.href = canonicalUrl;

            // 3. Set Open Graph URL for Social Media Sharing (Facebook, LinkedIn, etc.)
            let ogUrl = document.querySelector('meta[property="og:url"]');
            if (!ogUrl) {
                ogUrl = document.createElement('meta');
                ogUrl.setAttribute('property', 'og:url');
                document.head.appendChild(ogUrl);
            }
            ogUrl.content = canonicalUrl;
            } else {
            // 4. Fallback: If no ID is present, direct crawlers back to the main blog page or set noindex
            let robotsMeta = document.querySelector('meta[name="robots"]');
            if (!robotsMeta) {
                robotsMeta = document.createElement('meta');
                robotsMeta.name = 'robots';
                document.head.appendChild(robotsMeta);
            }
            robotsMeta.content = 'noindex, follow';
            }

        </script>


        <!-- CSS FILES -->        
        <link href="/css/bootstrap.min.css" rel="stylesheet">
        <link href="/css/bootstrap-icons.css" rel="stylesheet">
        <link href="/css/tff-stylesheet.css" rel="stylesheet">


</head>
    
<body>
<div id="en-navbar"></div>

            <section class="section-padding">
                <div class="container-fluid px-5">
                    <div class="row"">

                        <div class="col-lg-10 col-12 header-section header-section-en">
                            <h2 id="title"></h2>
                        </div>

                        <div class="col-12 my-3 mb-5">
                            <hr class="divider">
                        </div>
                        
                        <div class="container">
                            <div class="col-lg-10 col-md-6 col-sm-8 col-12 mx-auto">
                                <div class="single-course-wrapper mx-auto mb-5">
                                    <img class="single-course-image" id="image">
                                </div>
                                <div class="embed-video-wrap" id="embed-video">
                                    
                                </div>

                                <p class="course-description mx-auto mb-5" id="description">
                                    
                                </p>
                                <p class="mx-auto text-center">Price: <strong id="price"></strong> EGP</p>
                                <script src="https://unpkg.com/marked@4.3.0/marked.min.js"></script>
                                <script>
                                    const params = new URLSearchParams(window.location.search);
                                    const courseId = params.get("id");
                                    const lang = "en";
                                    
                                    fetch('/_data/courses.json')
                                    .then(res => res.json())
                                    .then(data => {
                                        const content = data.courses.find(c => c.id === courseId);
                                        const course = content[lang];

                                        document.getElementById("title").textContent = course.title;
                                        const embedVideo = document.getElementById("embed-video");
                                        if (content.video_url != undefined) {
                                        content.video_url.forEach(url =>{
                                            embedVideo.innerHTML += url;
                                        });
                                        }
                                        
                                        document.getElementById("description").innerHTML = marked.parse(course.body);
                                        document.getElementById("price").textContent = content.price;
                                        document.getElementById("image").src = content.thumbnail;
                                        document.getElementById("image").alt = course.title + " course image";

                                        const bookBtn = document.getElementById("book-button");
                                        if (bookBtn) {
                                            if(content.kids === true){
                                            bookBtn.href = `book-course-kids.html?id=${courseId}`;
                                            }
                                            else{
                                                bookBtn.href = `book-course.html?id=${courseId}`;
                                            }
                                        }
                                    });
                                </script>
                                <div class="text-center">
                                    <a class="btn btn-outline-primary btn-lg w-50 book-button mb-4" id="book-button" href="#">
                                        Book
                                    </a>
                                    <a class="btn btn-outline-secondary btn-lg w-50 back-button" href="/en/courses.html">
                                      Back to Courses
                                    </a>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </section>

            
        </main>

        <div id="en-footer"></div>

        <!-- JAVASCRIPT FILES -->
        <script src="/js/include.js"></script>
        <script src="/js/jquery.min.js"></script>
        <script src="/js/bootstrap.min.js"></script>
        <script src="/js/jquery.sticky.js"></script>
        <!-- <script src="/js/click-scroll.js"></script> -->
        <!-- <script src="js/sideways-scroll.js"></script> -->

    </body>
</html>
